<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Philz Signature" />
    <link rel="apple-touch-icon" href="/brand/philz-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Philz Signature | Luxury Perfumes & Artisanal Fragrances Nigeria</title>
    <meta name="description" content="Discover Philz Signature — Nigeria's premier luxury fragrance house. Shop artisanal parfums, signature scents, and bespoke fragrances. Free delivery available." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.philzsignature.com" />
    <meta property="og:title" content="Philz Signature | Luxury Parfums" />
    <meta property="og:description" content="Discover Philz Signature — Nigeria's premier luxury fragrance house. Shop artisanal parfums, signature scents, and bespoke fragrances. Free delivery available." />
    <meta property="og:image" content="https://www.philzsignature.com/brand/philz-favicon.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.philzsignature.com" />
    <meta name="twitter:title" content="Philz Signature | Luxury Parfums" />
    <meta name="twitter:description" content="Discover Philz Signature — Nigeria's premier luxury fragrance house. Shop artisanal parfums, signature scents, and bespoke fragrances. Free delivery available." />
    <meta name="twitter:image" content="https://www.philzsignature.com/brand/philz-favicon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.philzsignature.com/#organization",
          "name": "Philz Signature",
          "url": "https://www.philzsignature.com",
          "logo": "https://www.philzsignature.com/brand/philz-favicon.png",
          "description": "Nigeria's premier luxury fragrance house creating artisanal parfums, signature scents, and bespoke home fragrances.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Service",
            "telephone": "+2348000000000",
            "areaServed": "NG",
            "availableLanguage": ["English"]
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.philzsignature.com/#localbusiness",
          "name": "Philz Signature Fragrance House",
          "url": "https://www.philzsignature.com",
          "image": "https://www.philzsignature.com/brand/philz-favicon.png",
          "priceRange": "₦₦₦₦",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Lagos",
            "addressRegion": "Lagos State",
            "addressCountry": "NG"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
              "opens": "09:00",
              "closes": "19:00"
            }
          ]
        }
      ]
    }
    </script>
    
    <script>
      (function() {
        try {
          localStorage.setItem('ps-theme', 'dark');
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- DNS Prefetch and Font Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts with display=swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-luxury-black text-luxury-cream antialiased selection:bg-luxury-gold/30 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
